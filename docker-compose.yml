services:
  db:
    build:
      context: ./docker
      dockerfile: postgres.Dockerfile
    container_name: meetscribe-db
    environment:
      POSTGRES_USER: meetscribe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Birdsey5@}
      POSTGRES_DB: meetscribe
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetscribe -d meetscribe"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - meetscribe-network

  redis:
    image: redis:7-alpine
    container_name: meetscribe-redis
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - meetscribe-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meetscribe-api
    environment:
      DATABASE_URL: postgresql+asyncpg://meetscribe:${POSTGRES_PASSWORD:-Birdsey5%40}@db:5432/meetscribe
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-me-in-production}
      AUDIO_DAEMON_HOST: host.docker.internal
      AUDIO_DAEMON_PORT: 9000
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      WHISPER_MODEL: ${WHISPER_MODEL:-medium}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-float16}
      WHISPER_BATCH_SIZE: ${WHISPER_BATCH_SIZE:-8}
      HF_TOKEN: ${HF_TOKEN:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      RECORDINGS_PATH: /data/recordings
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./data/recordings:/data/recordings
    ports:
      - "8005:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - meetscribe-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meetscribe-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8005
      NEXT_PUBLIC_WS_URL: ws://localhost:8005
    ports:
      - "3001:3000"
    depends_on:
      - api
    networks:
      - meetscribe-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
  redis_data:

networks:
  meetscribe-network:
    driver: bridge
